<!DOCTYPE html>
<html>
<head>
<script src="numericParser.js"></script>
<style>
/* prevent padding or margin changes size */
* 
{ 
	-moz-box-sizing: border-box; 
	-webkit-box-sizing: border-box; 
	box-sizing: border-box; 
}
html, body 
{
    text-color: black;
    background-color: white;

    font-family: "Noto Sans", "Segoe UI", serif;
    font-size: 9.75pt;
    font-weight: normal;
	
	width: 100%;
	margin: 0;
	padding: 0;
	overflow-X: hidden;
	overflow-Y: hidden;
}
body h1
{
	margin-top: 20px;
	margin-left: 30px;
}
.textBox 
{
	position: absolute;
	display: block;
	padding: 0;
	margin: 0;
	background-color: green;
	border: 1px solid #4265b2;
	border-radius: 3px;
	overflow: hidden;
	/*overflow-Y: scroll;*/
}
.textBoxWorkSpace
{
	position: absolute;
	display: block;
	padding: 0px;
	margin: 0;
	left: 0;
	top: 0;
	background-color: yellow;
	overflow-Y: scroll;
	overflow-X: scroll;
}
.textBoxContent 
{
	position: absolute;
	padding: 6px;
	margin: 0;
	left: 0;
	top: 0;
	min-height: 30px;
    font-family: Courier New;
	font-size: 12pt;
	outline-style: none;
	white-space: pre-wrap;
	word-wrap: break-word;
	background-color: lightsteelblue;
}
.textBoxContent:focus
{
	background-color: lightblue;
}
.textBoxValueSpace
{
	position: absolute;
	padding: 6px;
	margin: 0;
	top: 0;
	min-height: 30px;
    font-family: Courier New;
	font-size: 12pt;
	background-color: steelblue;
	text-align: right;
	overflow: hidden;
}
.textBoxStatusSpace
{
	position: absolute;
	padding: 7px 6px;
	margin: 0;
	left: 0;
	height: 30px;
	min-height: 30px;
	max-height: 30px;
    /*font-family: Courier New;
	font-size: 12pt;*/
	background-color: lightgray;
	text-align: left;
	overflow: hidden;
}
.textBoxTotalSpace
{
	position: absolute;
	padding: 7px 6px;
	margin: 0;
	height: 30px;
	min-height: 30px;
	max-height: 30px;
    font-family: Courier New;
	font-size: 12pt;
	background-color: lightsteelblue;
	text-align: right;
	overflow: hidden;
}
</style>
<script>
var textBox1;
</script>
</head>
<body>
<h1>Numeric Parser</h1>
<div class="textBox" id="textBox1">
	<div class="textBoxWorkSpace">
		<div class="textBoxContent" contenteditable>
		</div>
	</div>
	<div class="textBoxValueSpace">Ergebnisse
	</div>
	<div class="textBoxStatusSpace">Status</div>
	<div class="textBoxTotalSpace">Total
	</div>
</div>

<script>
var dimensionChain =
	"# Comment\r\n" +
	"* Comment\r\n" +
	"\" Comment\r\n" +
	"Comment: 3*-4,25 =\r\n" +
	"Comment: 1+\r\n" +
	"Comment: -4 \"Comment\" * 2 =\r\n" +
	"pi=\r\n" +
	"sin(100)=\r\n" +
	"sqrt(2*pi + e**2)=\r\n" +
	"(1+-4) * 2=\r\n" +
	"17=\r\n";

window.onload = function()
{

	//var input = document.getElementById("input");
	//input.innerText = dimensionChain;
	//calculate();
	textBox1 = new textBox(document.getElementById("textBox1"));
	textBox1.setText(dimensionChain);
	window.onresize();
};

window.onresize = function()
{
	var cxBody = window.innerWidth;
	var cyBody = window.innerHeight;
	var bodyContent = document.getElementById("bodyContent");
	document.body.style.width = cxBody.toString() + "px";
	document.body.style.height = cyBody.toString() + "px";
	
	textBox1.moveTo(30, 70, cxBody - 60, cyBody - 100);
};

var textBox = function(elem)
{
	this.elem = elem;
	this.workSpace = elem.firstElementChild;
	this.valueSpace = this.workSpace.nextElementSibling;
	this.statusSpace = this.valueSpace.nextElementSibling;
	this.totalSpace = this.statusSpace.nextElementSibling;
	this.contentSpace = this.workSpace.firstElementChild;
	this.contentWidth = 4; // 4 Zoll
	this.parser = new NumericParser();
	
	this.moveTo = function(x, y, cx, cy)
	{ 
		this.elem.style.left = x.toString() + "px";
		this.elem.style.top = y.toString() + "px";
		this.elem.style.width = cx.toString() + "px";
		this.elem.style.minWidth = cx.toString() + "px";
		this.elem.style.maxWidth = cx.toString() + "px";
		this.elem.style.height = cy.toString() + "px";
		this.elem.style.minHeight = cy.toString() + "px";
		this.elem.style.maxHeight = cy.toString() + "px";
		
		cx = this.elem.clientWidth;
		cy = this.elem.clientHeight;
		var cyStatus = 30;
		var cyContent = cy - cyStatus;
		var requiredCx = (this.contentWidth * 96) + 12;  
		var cxValueSpace = 1.3 * 96 + 12;
		var cxWorkSpace = cx - cxValueSpace;
		var xValueSpace = cx - cxValueSpace;
		if ((requiredCx + cxValueSpace) < cx)
		{	
			cxWorkSpace = requiredCx;
			xValueSpace = requiredCx;
		}
		
		this.workSpace.style.width = cxWorkSpace.toString() + "px";
		this.workSpace.style.minWidth = cxWorkSpace.toString() + "px";
		this.workSpace.style.maxWidth = cxWorkSpace.toString() + "px";
		this.workSpace.style.height = cyContent.toString() + "px";
		this.workSpace.style.minHeight = cyContent.toString() + "px";
		this.workSpace.style.maxHeight = cyContent.toString() + "px";
		
		this.contentSpace.style.width = requiredCx.toString() + "px";
		this.contentSpace.style.minWidth = requiredCx.toString() + "px";
		this.contentSpace.style.maxWidth = requiredCx.toString() + "px";
		
		this.valueSpace.style.left = xValueSpace.toString() + "px";
		this.valueSpace.style.width = cxValueSpace.toString() + "px";
		this.valueSpace.style.minWidth = cxValueSpace.toString() + "px";
		this.valueSpace.style.maxWidth = cxValueSpace.toString() + "px";

		this.statusSpace.style.top = cyContent.toString() + "px";
		this.statusSpace.style.width = cxWorkSpace.toString() + "px";
		this.statusSpace.style.minWidth = cxWorkSpace.toString() + "px";
		this.statusSpace.style.maxWidth = cxWorkSpace.toString() + "px";

		this.totalSpace.style.top = cyContent.toString() + "px";
		this.totalSpace.style.left = xValueSpace.toString() + "px";
		this.totalSpace.style.width = cxValueSpace.toString() + "px";
		this.totalSpace.style.minWidth = cxValueSpace.toString() + "px";
		this.totalSpace.style.maxWidth = cxValueSpace.toString() + "px";
	};
	
	this.setText = function(t)
	{
		this.contentSpace.innerText = t;
		this.calculate();
	};
	
	this.calculate = function()
	{
		var dimChain = this.contentSpace.innerText;
		var lines = dimChain.split('\n');
		var formula = "";
		var total = 0.00;
		var errMsg = "";
		
		for (var i = 0; i < lines.length; i++)
		{
			var line = this.parser.getValueRelevantShare(lines[i]);
			if ((line != "") && (line[line.length - 1] == '='))
			{
				formula += line.substring(0, line.length - 1);
				
				if (this.parser.execute(formula))		
				{
					total += this.parser.getResult();
					lines[i] = this.parser.formatValue();
				}
				else
				{
					lines[i] = this.parser.ErrorMessage;
					if (errMsg == "") errMsg = this.parser.ErrorMessage;
				}

				formula = "";
			}
			else
			{
				formula += line;
				lines[i] = "";
			}
		}

		this.valueSpace.innerText = lines.join('\n');
		this.statusSpace.innerText = errMsg;
		this.totalSpace.innerText = this.parser.formatValue(total);
	};

	var tb = this;
	this.workSpace.onscroll = function(event)
	{
		var newTop = tb.workSpace.scrollTop.toString();
		tb.valueSpace.style.top = (-newTop).toString() + "px";
	};

	return this;
};
</script>
</body>
</html>
